name: RSSL Acquisition V2 Schema Preflight
# Rerun schema verification after 18 Nov 2026 customer-approved migration

on:
  push:
    paths:
      - '.github/workflows/rssl-acquisition-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify Supabase schema without reading private response values
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.RSSL_SUPABASE_SECRET_KEY }}
        run: python scripts/rssl_acquisition_preflight.py
