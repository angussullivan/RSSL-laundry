name: RSSL Weekly Customer Insights Email

on:
  schedule:
    - cron: '17 9 * * 1'
      timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the report in Actions logs without sending email'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rssl-weekly-report
  cancel-in-progress: false

jobs:
  email-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout RSSL repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate report and send email
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RSSL_SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RSSL_RESEND_API_KEY }}
          RSSL_REPORT_TO: ${{ secrets.RSSL_REPORT_TO }}
          RSSL_REPORT_FROM: ${{ secrets.RSSL_REPORT_FROM }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/rssl_weekly_report.py --dry-run
          else
            python scripts/rssl_weekly_report.py
          fi
