name: RSSL Customer Insights — Manual Database Preview

# Email sending moved to Google Apps Script due to Gmail SMTP disconnects
# on GitHub runners (ports 465 and 587). No email is sent by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout RSSL repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run kiosk and reporting regression tests
        run: |
          node survey/test_kiosk.js
          node survey/test_sw.js
          python -m unittest discover -s scripts -p 'test_rssl_weekly_report.py'
      - name: Read Supabase and preview last completed week (no email)
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.RSSL_SUPABASE_SECRET_KEY }}
        run: python scripts/rssl_weekly_report.py --dry-run
