name: RSSL Weekly Customer Insights Email

on:
  schedule:
    - cron: '17 9 * * 1'
      timezone: 'Australia/Sydney'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the report in Actions logs without sending email'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rssl-weekly-report
  cancel-in-progress: false

jobs:
  email-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout RSSL repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run kiosk and reporting regression tests
        run: |
          node survey/test_kiosk.js
          python -m unittest discover -s scripts -p 'test_rssl_weekly_report.py'
      - name: Generate report and send email
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.RSSL_SUPABASE_SECRET_KEY }}
          RSSL_GMAIL_APP_PASSWORD: ${{ secrets.RSSL_GMAIL_APP_PASSWORD }}
          RSSL_REPORT_TO: ${{ secrets.RSSL_REPORT_TO }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/rssl_weekly_report.py --dry-run
          else
            python scripts/rssl_weekly_report.py
          fi
