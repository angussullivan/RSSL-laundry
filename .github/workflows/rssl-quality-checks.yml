name: RSSL Survey Quality Checks

on:
  push:
    paths:
      - 'survey/index.html'
      - 'survey/sw.js'
      - 'survey/test_kiosk.js'
      - 'survey/test_acquisition_v2.js'
      - 'survey/test_sw.js'
      - 'google-tag-config.js'
      - 'scripts/test_google_tag.js'
      - 'index.html'
      - 'scripts/rssl_weekly_report.py'
      - 'scripts/test_rssl_weekly_report.py'
      - 'scripts/RSSL_Weekly_Email_Apps_Script.gs'
      - 'scripts/test_apps_script.js'
      - '.github/workflows/rssl-weekly-report.yml'
      - '.github/workflows/rssl-quality-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test survey JavaScript, translation data and offline queue
        run: |
          node survey/test_kiosk.js
          node survey/test_acquisition_v2.js
          node survey/test_sw.js
          node scripts/test_google_tag.js
      - name: Validate Google Apps Script Monday email sender and DST boundaries
        run: node scripts/test_apps_script.js
      - name: Compile live integration probes without sending data
        run: python -m py_compile scripts/rssl_acquisition_smoke.py scripts/rssl_acquisition_preflight.py
      - name: Test legacy reporting calculations and Supabase reads
        run: python -m unittest discover -s scripts -p 'test_rssl_weekly_report.py' -v
