name: RSSL Survey Quality Checks

on:
  push:
    paths:
      - 'survey/index.html'
      - 'survey/sw.js'
      - 'survey/test_kiosk.js'
      - 'scripts/rssl_weekly_report.py'
      - 'scripts/test_rssl_weekly_report.py'
      - '.github/workflows/rssl-weekly-report.yml'
      - '.github/workflows/rssl-quality-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test survey JavaScript, translation data and offline queue
        run: node survey/test_kiosk.js
      - name: Test reporting metrics, dates and mocked Gmail delivery
        run: python -m unittest discover -s scripts -p 'test_rssl_weekly_report.py' -v
