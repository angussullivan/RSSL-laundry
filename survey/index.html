<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b3939">
  <meta name="description" content="Anonymous 20-second customer survey for Reservoir Street Self Service Laundry.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Reservoir Street Laundry · Customer survey</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 50 50" fill="none"><circle cx="25" cy="25" r="22" stroke="currentColor" stroke-width="2"/><path d="M8 27h34M14 33c5-4 9-4 14 0s9 4 14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="25" cy="18" r="7" stroke="currentColor" stroke-width="2"/></svg>
        </div>
        <div><div class="brand-name">RESERVOIR STREET</div><div class="brand-sub">SELF SERVICE LAUNDRY · SURRY HILLS</div></div>
      </div>
      <div class="topbar-side"><span id="connection" class="connection" role="status" aria-live="polite">Checking connection</span></div>
    </header>

    <div id="setup-banner" class="setup-banner" hidden><strong>PREVIEW MODE</strong> — Survey works, but answers are not stored. Connect Supabase before using with customers.</div>

    <main id="view" class="view" aria-live="polite"></main>

    <footer class="footer"><span>Anonymous survey · No name or contact details requested</span><span>67 Reservoir Street, Surry Hills</span></footer>
  </div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
